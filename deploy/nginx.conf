# labelme-web — NGINX 反向代理
# 放到 /etc/nginx/sites-available/labelme-web，再软链到 sites-enabled/
# 后端由 systemd 单元 labelme-web.service 监听 127.0.0.1:9631

upstream labelme_web_backend {
    server 127.0.0.1:9631;
    keepalive 16;
}

server {
    listen 127.0.0.1:9630;
    # listen [::]:9630;  # 仅本机回环，避免明文 HTTP 暴露到公网
    server_name _;

    # 单张图像上限，需与 LABELME_WEB_MAX_UPLOAD_MB 一致
    client_max_body_size 200m;
    client_body_timeout 300s;

    # 上传/保存超时放宽，大图 base64 与批量上传更稳
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    access_log /var/log/nginx/labelme-web.access.log;
    error_log  /var/log/nginx/labelme-web.error.log;

    # 网关自身拿不到后端时（502/503/504）也显示统一页面；
    # 如果安装目录不是 /opt/labelme-web，把下面的 root 改到实际的 frontend 目录
    proxy_intercept_errors on;
    error_page 502 503 504 /50x.html;

    location = /50x.html {
        root /opt/labelme-web/frontend;
        internal;
    }

    location / {
        proxy_pass http://labelme_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 前端静态文件交给 FastAPI 的 StaticFiles 挂载，这里不缓存 index
        proxy_buffering off;
    }
}
